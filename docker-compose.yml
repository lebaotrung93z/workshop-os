services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workshop_os
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
    ports:
      - "5433:5432"
    volumes:
      - workshop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  workshop_pg:
