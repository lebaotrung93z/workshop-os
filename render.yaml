services:
  - type: web
    name: workshop-os-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: workshop-os-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: workshop-os-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: workshop-os-db
          property: password
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

  - type: web
    name: workshop-os-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache

databases:
  - name: workshop-os-db
    plan: free
    databaseName: workshop_os
    user: workshop
