services:
  - type: web
    name: workshop-os-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist/web/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
