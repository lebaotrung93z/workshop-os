server:
  address: 0.0.0.0
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 40
      min-spare: 2

spring:
  application:
    name: workshop-os-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/workshop_os}
    username: ${SPRING_DATASOURCE_USERNAME:workshop}
    password: ${SPRING_DATASOURCE_PASSWORD:workshop}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        temp:
          use_jdbc_metadata_defaults: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  ai:
    provider: ${AI_PROVIDER:groq}
    groq:
      api-key: ${GROQ_API_KEY:}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      model: ${OLLAMA_MODEL:llama3.2}

logging:
  level:
    root: WARN
    com.bosch.workshop: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
